name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Verify tag matches plugin.json
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match .claude-plugin/plugin.json version $PLUGIN_VERSION."
            echo "Bump plugin.json to $TAG_VERSION, or retag as v$PLUGIN_VERSION, then release again."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches plugin.json."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the .mcpb bundle and check it against server.json
        # The bundle is built from the committed bin/recap.mjs with fixed bytes,
        # so its sha256 must equal the one server.json gives the MCP registry.
        run: |
          node scripts/pack-mcpb.mjs --check
          node scripts/pack-mcpb.mjs

      - name: Create the release, or attach the bundle to the one that exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/recap-studio.mcpb --clobber
          else
            gh release create "$TAG" dist/recap-studio.mcpb --title "$TAG" --generate-notes
          fi

  sync-10x:
    name: Sync 10x marketplace
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch plugin-released to 10x
        env:
          DISPATCH_TOKEN: ${{ secrets.TEN_X_DISPATCH_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "TEN_X_DISPATCH_TOKEN secret not set; skipping 10x sync."
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Aboudjem/10x/dispatches \
            -d "{\"event_type\":\"plugin-released\",\"client_payload\":{\"plugin\":\"recap-studio\",\"version\":\"$VERSION\"}}")
          if [ "$HTTP_CODE" != "204" ]; then
            echo "10x dispatch failed with HTTP $HTTP_CODE:"
            cat /tmp/dispatch.json
            echo "Rotate TEN_X_DISPATCH_TOKEN at https://github.com/Aboudjem/recap-studio/settings/secrets/actions"
            exit 1
          fi
          echo "10x dispatch succeeded (HTTP 204)."
