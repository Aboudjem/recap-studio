<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Topic or session goes in, recap page comes out: specialist agents draft the content, deterministic checks validate it, then the renderer builds a self-contained HTML page.">
  <defs>
    <linearGradient id="rs-hg-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#0C1328"/>
      <stop offset="60%"  stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>

    <radialGradient id="rs-hg-bloom" cx="0.5" cy="1" r="0.75">
      <stop offset="0%"   stop-color="#8E7BFF" stop-opacity="0.20"/>
      <stop offset="38%"  stop-color="#5B9DFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5B9DFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="rs-hg-glowsm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
      <radialGradient id="v2-bloomA" cx="0.18" cy="0.22" r="0.72">
      <stop offset="0%" stop-color="#5B9DFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5B9DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v2-bloomB" cx="0.84" cy="0.86" r="0.68">
      <stop offset="0%" stop-color="#8E7BFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#8E7BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .card  { fill: #0E1524; stroke: #1E2A42; stroke-width: 1; }
    .title { font-size: 15px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.2px; }
    .item  { font-size: 11.5px; font-weight: 500; fill: #C2CDE4; }
    .cap   { font-size: 11px; fill: #93A2BE; }
    .cap2  { font-size: 10px; fill: #93A2BE; }
    .tag   { font-size: 11.5px; letter-spacing: 1.6px; fill: #93A2BE; }
    .step  { font-size: 10.5px; font-weight: 600; letter-spacing: 2.4px; fill: #5B9DFF; }

    @keyframes rs-hg-breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .bloom { animation: rs-hg-breathe 9s ease-in-out infinite; }

    @keyframes rs-hg-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: rs-hg-flow 14s linear infinite; }

    @keyframes rs-hg-pip { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .p1 { animation: rs-hg-pip 5s ease-in-out infinite 0s; }
    .p2 { animation: rs-hg-pip 5s ease-in-out infinite 0.35s; }
    .p3 { animation: rs-hg-pip 5s ease-in-out infinite 0.7s; }
    .p4 { animation: rs-hg-pip 5s ease-in-out infinite 1.05s; }

    @keyframes rs-hg-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .row-1 { animation: rs-hg-rise 0.6s ease-out 0.30s both; }
    .row-2 { animation: rs-hg-rise 0.6s ease-out 0.45s both; }
    .row-3 { animation: rs-hg-rise 0.6s ease-out 0.60s both; }
    .row-4 { animation: rs-hg-rise 0.6s ease-out 0.75s both; }
    .row-5 { animation: rs-hg-rise 0.6s ease-out 0.90s both; }
    .row-6 { animation: rs-hg-rise 0.6s ease-out 1.05s both; }
    .row-7 { animation: rs-hg-rise 0.6s ease-out 1.20s both; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      @keyframes v2-breathe { 0%,100% { opacity:0.66; } 50% { opacity:1; } }
    .v2bloom { animation: v2-breathe 11s ease-in-out infinite; }
  </style>

  <rect width="1200" height="320" fill="url(#rs-hg-ground)"/>
  <g class="v2bloom"><rect width="1200" height="320" fill="url(#v2-bloomA)"/><rect width="1200" height="320" fill="url(#v2-bloomB)"/></g>
  <ellipse class="bloom" cx="600" cy="324" rx="700" ry="150" fill="url(#rs-hg-bloom)"/>

  <!-- connectors, left to right -->
  <g stroke="#5B9DFF" stroke-width="1.5" fill="none">
    <line x1="248" y1="160" x2="284" y2="160" opacity="0.45"/>
    <line class="flowline" x1="248" y1="160" x2="284" y2="160" stroke-dasharray="3 6"/>
    <line x1="524" y1="160" x2="572" y2="160" opacity="0.45"/>
    <line class="flowline" x1="524" y1="160" x2="572" y2="160" stroke-dasharray="3 6"/>
    <line x1="824" y1="160" x2="848" y2="160" opacity="0.45"/>
    <line class="flowline" x1="824" y1="160" x2="848" y2="160" stroke-dasharray="3 6"/>
  </g>
  <g filter="url(#rs-hg-glowsm)">
    <g class="p1"><circle cx="266" cy="160" r="3.5" fill="#5B9DFF"/></g>
    <g class="p2"><circle cx="548" cy="160" r="3.5" fill="#8E7BFF"/></g>
    <g class="p3"><circle cx="836" cy="160" r="3.5" fill="#C77DFF"/></g>
  </g>

  <!-- 1. input -->
  <rect class="card" x="36" y="112" width="212" height="96" rx="14"/>
  <text class="mono step"  x="142" y="104" text-anchor="middle">IN</text>
  <text class="disp title" x="142" y="152" text-anchor="middle">Topic / session</text>
  <text class="mono cap"   x="142" y="178" text-anchor="middle">/recap "Latest AI models"</text>

  <!-- 2. specialist agents -->
  <rect class="card" x="284" y="56" width="240" height="208" rx="14"/>
  <text class="disp title" x="404" y="90" text-anchor="middle">Specialist agents</text>
  <line x1="304" y1="104" x2="504" y2="104" stroke="#1E2A42" stroke-width="1"/>
  <g class="disp item">
    <g class="row-1"><text x="304" y="128">· research-scout</text></g>
    <g class="row-2"><text x="304" y="148">· source-librarian</text></g>
    <g class="row-3"><text x="304" y="168">· fact-checker</text></g>
    <g class="row-4"><text x="304" y="188">· learning-architect</text></g>
    <g class="row-5"><text x="304" y="208">· visual-story-designer</text></g>
    <g class="row-6"><text x="304" y="228">· frontend-builder</text></g>
    <g class="row-7"><text x="304" y="248">· repo-session-analyst</text></g>
  </g>

  <!-- 3. heuristic checks -->
  <rect class="card" x="572" y="56" width="252" height="208" rx="14"/>
  <text class="disp title" x="698" y="90" text-anchor="middle">Heuristic checks</text>
  <line x1="592" y1="104" x2="804" y2="104" stroke="#1E2A42" stroke-width="1"/>
  <g class="disp item">
    <g class="row-1"><text x="592" y="128">facts (citations present)</text></g>
    <g class="row-2"><text x="592" y="148">beginner (jargon scan)</text></g>
    <g class="row-3"><text x="592" y="168">accessibility (structure)</text></g>
    <g class="row-4"><text x="592" y="188">UX (section balance)</text></g>
    <g class="row-5"><text x="592" y="208">performance (size)</text></g>
    <g class="row-6"><text x="592" y="228">sec/privacy (secret regex)</text></g>
    <g class="row-7"><text x="592" y="248">simplicity (word count)</text></g>
  </g>

  <!-- 4. output -->
  <rect class="card" x="848" y="112" width="312" height="96" rx="14"/>
  <text class="mono step"  x="1004" y="104" text-anchor="middle">OUT</text>
  <text class="disp title" x="1004" y="152" text-anchor="middle">Self-contained HTML page</text>
  <text class="mono cap2"  x="1004" y="178" text-anchor="middle">mobile-first · static-first · cite-every-claim</text>

  <!-- repo signal -->
  <g filter="url(#rs-hg-glowsm)">
    <g class="p4"><circle cx="44" cy="296" r="4.5" fill="#3DFFAB"/></g>
  </g>
  <text class="mono tag" x="60" y="300">73 tests pass</text>
</svg>
