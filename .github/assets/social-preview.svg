<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none" role="img" aria-label="recap-studio: any topic, one file you can double-click. Dark-mode, mobile-first, reads offline in about five minutes.">
  <defs>
    <linearGradient id="rs-sp-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#0A0F1C"/>
      <stop offset="60%"  stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="rs-sp-bloom" cx="0.5" cy="1" r="0.75">
      <stop offset="0%"   stop-color="#FF2D78" stop-opacity="0.28"/>
      <stop offset="38%"  stop-color="#8E7BFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8E7BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rs-sp-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#5B9DFF"/>
      <stop offset="100%" stop-color="#8E7BFF"/>
    </linearGradient>

    <linearGradient id="rs-sp-horizon" gradientUnits="userSpaceOnUse" x1="80" y1="520" x2="1200" y2="520">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#5B9DFF" stop-opacity="0.5"/>
      <stop offset="55%"  stop-color="#8E7BFF" stop-opacity="0.8"/>
      <stop offset="82%"  stop-color="#FF2D78" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <rect width="1280" height="640" fill="url(#rs-sp-ground)"/>
  <ellipse cx="640" cy="646" rx="760" ry="290" fill="url(#rs-sp-bloom)" opacity="0.8"/>

  <line x1="80" y1="520" x2="1200" y2="520" stroke="url(#rs-sp-horizon)" stroke-width="1.5" opacity="0.95"/>

  <text class="mono" x="80" y="206" font-size="16" font-weight="600" letter-spacing="5" fill="#5B9DFF">ONE-FILE EXPLAINERS</text>

  <text class="disp" x="80" y="310" font-size="104" font-weight="800" letter-spacing="-4"
        fill="url(#rs-sp-brand)">recap-studio</text>

  <text class="disp" x="80" y="382" font-size="30" font-weight="600" fill="#F2F6FF">Any topic, one file you can double-click.</text>
  <text class="disp" x="80" y="428" font-size="24" font-weight="500" fill="#B6C2DA">Dark-mode, mobile-first, reads offline in about five minutes.</text>

  <text class="mono" x="80" y="572" font-size="16" letter-spacing="1.6" fill="#8494B0">github.com/Aboudjem/recap-studio</text>

  <!-- reserved for the composited PNG mark: x 930 to 1150, y 210 to 430. Draw nothing here. -->
</svg>
