<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img"
     aria-label="recap-studio: a page corner folds while a second page stacks up behind it">
  <title>recap-studio</title>
  <defs>
    <linearGradient id="rc-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7F8FB"/>
      <stop offset="100%" stop-color="#EEF1F7"/>
    </linearGradient>
    <radialGradient id="rc-bloomA" cx="0.15" cy="0.13" r="0.44">
      <stop offset="0%" stop-color="#0959D1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0959D1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rc-bloomB" cx="0.88" cy="0.85" r="0.50">
      <stop offset="0%" stop-color="#5D4BD1" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#5D4BD1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rc-bloomC" cx="0.52" cy="0.04" r="0.36">
      <stop offset="0%" stop-color="#006A80" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#006A80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rc-wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#0959D1" stop-opacity="0.07"/>
      <stop offset="42%"  stop-color="#5D4BD1" stop-opacity="0.043"/>
      <stop offset="76%"  stop-color="#006A80" stop-opacity="0.016"/>
      <stop offset="100%" stop-color="#006A80" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rc-frame"><rect width="720" height="200"/></clipPath>
    <linearGradient id="rc-ink" gradientUnits="userSpaceOnUse" x1="62" y1="60" x2="200" y2="210">
      <stop class="rck1" offset="0%"   stop-color="#0959D1"/>
      <stop class="rck2" offset="52%"  stop-color="#0959D1"/>
      <stop class="rck3" offset="100%" stop-color="#5D4BD1"/>
    </linearGradient>
    <linearGradient id="rc-word" x1="0" y1="0" x2="1" y2="0.25">
      <stop class="rck1" offset="0%"   stop-color="#0959D1"/>
      <stop class="rck2" offset="46%"  stop-color="#0959D1"/>
      <stop class="rck3" offset="100%" stop-color="#5D4BD1"/>
    </linearGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #0959D1; }
    .head    { font-size: 22px; font-weight: 700; fill: #1A2233; letter-spacing: -0.5px; }
    .sub     { font-size: 16.5px; font-weight: 500; fill: #48546B; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #48546B; }
    .chip    { font-size: 11.5px; letter-spacing: 1.2px; fill: #48546B; }
    @keyframes rc-breathe { 0%,100% { opacity:0.72; } 50% { opacity:1; } }
    .rcbloom { animation: rc-breathe 11s ease-in-out infinite; }
    @keyframes rc-sweep { 0% { transform: translateX(-360px); } 100% { transform: translateX(1080px); } }
    .rcwash { animation: rc-sweep 15s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes rc-flow { to { stroke-dashoffset: -1000; } }
    .rcedge { stroke-dasharray: 420 580; animation: rc-flow 8s linear infinite; }
    @keyframes rc-stack { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4px,-8px); } }
    .rcstack { animation: rc-stack 8s ease-in-out infinite; }
    @keyframes rc-fold { 0%,14% { opacity: 0.25; } 46%,86% { opacity: 1; } 100% { opacity: 0.25; } }
    .rcfold { animation: rc-fold 8s cubic-bezier(.3,0,.2,1) infinite; }
    @keyframes rc-k1 { 0%,100% { stop-color:#0959D1; } 50% { stop-color:#5D4BD1; } }
    @keyframes rc-k2 { 0%,100% { stop-color:#0959D1; } 50% { stop-color:#0959D1; } }
    @keyframes rc-k3 { 0%,100% { stop-color:#5D4BD1; } 50% { stop-color:#8A2CD1; } }
    .rck1 { animation: rc-k1 15s ease-in-out infinite; }
    .rck2 { animation: rc-k2 15s ease-in-out infinite; }
    .rck3 { animation: rc-k3 15s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="720" height="200" fill="url(#rc-ground)"/>
  <g class="rcbloom">
    <rect width="720" height="200" fill="url(#rc-bloomA)"/>
    <rect width="720" height="200" fill="url(#rc-bloomB)"/>
    <rect width="720" height="200" fill="url(#rc-bloomC)"/>
  </g>
  <g clip-path="url(#rc-frame)">
    <g transform="translate(0,100)">
      <ellipse class="rcwash" cx="0" cy="0" rx="300" ry="180" fill="url(#rc-wash)"/>
    </g>
  </g>
  <g transform="translate(30,50) scale(0.3906)">
  <g class="rcstack" opacity="0.5">
    <rect x="86" y="50" width="110" height="132" rx="10" fill="none"
          stroke="url(#rc-ink)" stroke-width="10"/>
  </g>
  <path d="M74 66 H150 L184 100 V196 A10 10 0 0 1 174 206 H74 A10 10 0 0 1 64 196 V76 A10 10 0 0 1 74 66 Z" fill="url(#rc-ink)" fill-opacity="0.14" stroke="url(#rc-ink)"
        stroke-opacity="0.5" stroke-width="11" stroke-linejoin="round"/>
  <g>
    <path class="rcedge" d="M74 66 H150 L184 100 V196 A10 10 0 0 1 174 206 H74 A10 10 0 0 1 64 196 V76 A10 10 0 0 1 74 66 Z" pathLength="1000" fill="none"
          stroke="url(#rc-ink)" stroke-width="11" stroke-linejoin="round"/>
  </g>
  <g class="rcfold">
    <path d="M150 66 L184 100 H154 A4 4 0 0 1 150 96 Z" fill="url(#rc-ink)"/>
  </g>
  <g opacity="0.9" fill="url(#rc-ink)"><rect x="86" y="132" width="76" height="11" rx="5.5"/><rect x="86" y="156" width="56" height="11" rx="5.5"/></g>
  </g>
  <g>
    <text class="disp" x="140" y="108" font-size="62" font-weight="800"
          letter-spacing="-1.9" fill="url(#rc-word)">recap-studio</text>
  </g>
  <text class="mono tag" x="140" y="142">one-file explainers  &#183;  about 5 min read</text>
</svg>
