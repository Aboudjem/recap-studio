<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="recap-studio: one-file explainers, about a five minute read">
  <defs>
    <linearGradient id="rs-ld-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#0A0F1C"/>
      <stop offset="60%"  stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="rs-ld-bloom" cx="0.5" cy="1" r="0.75">
      <stop offset="0%"   stop-color="#FF2D78" stop-opacity="0.30"/>
      <stop offset="38%"  stop-color="#8E7BFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8E7BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rs-ld-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#5B9DFF"/>
      <stop offset="100%" stop-color="#8E7BFF"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rs-ld-mark" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#5B9DFF"/>
      <stop offset="100%" stop-color="#8E7BFF"/>
    </linearGradient>

    <linearGradient id="rs-ld-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD59A"/>
      <stop offset="30%"  stop-color="#FFB341"/>
      <stop offset="66%"  stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="rs-ld-horizon" gradientUnits="userSpaceOnUse" x1="36" y1="168" x2="684" y2="168">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#5B9DFF" stop-opacity="0.5"/>
      <stop offset="55%"  stop-color="#8E7BFF" stop-opacity="0.8"/>
      <stop offset="82%"  stop-color="#FF2D78" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rs-ld-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="168" x2="0" y2="200">
      <stop offset="0%"   stop-color="#5B9DFF" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#8E7BFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="rs-ld-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="rs-ld-atmo" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="rs-ld-frame"><rect width="720" height="200" rx="24"/></clipPath>
    <clipPath id="rs-ld-sunclip"><circle cx="642" cy="150" r="30"/></clipPath>
    <clipPath id="rs-ld-gridclip"><rect x="0" y="168" width="720" height="32"/></clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .tag  { font-size: 11.5px; letter-spacing: 1.6px; fill: #8494B0; }

    @keyframes rs-ld-breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .bloom { animation: rs-ld-breathe 9s ease-in-out infinite; }

    @keyframes rs-ld-sunpulse { 0%,100% { opacity: 0.42; } 50% { opacity: 0.62; } }
    .sun { animation: rs-ld-sunpulse 10s ease-in-out infinite; }

    @keyframes rs-ld-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: rs-ld-flow 14s linear infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#rs-ld-frame)">
    <rect width="720" height="200" fill="url(#rs-ld-ground)"/>
    <ellipse class="bloom" cx="360" cy="204" rx="430" ry="98" fill="url(#rs-ld-bloom)"/>

    <!-- sun disc on the horizon at the right, behind everything -->
    <g class="sun">
      <g filter="url(#rs-ld-atmo)">
        <circle cx="642" cy="150" r="30" fill="url(#rs-ld-sun)"/>
      </g>
      <g clip-path="url(#rs-ld-sunclip)" fill="#080C16">
        <rect x="606" y="155" width="72" height="1.6"/>
        <rect x="606" y="160" width="72" height="2.2"/>
        <rect x="606" y="166" width="72" height="3"/>
        <rect x="606" y="173" width="72" height="4"/>
      </g>
    </g>

    <!-- perspective grid below the horizon, shipped off -->
    <g id="grid" clip-path="url(#rs-ld-gridclip)" opacity="0">
      <g stroke="url(#rs-ld-gridfade)" stroke-width="1" fill="none">
        <path d="M360 168 L-700 200"/><path d="M360 168 L-260 200"/><path d="M360 168 L-20 200"/>
        <path d="M360 168 L120 200"/> <path d="M360 168 L240 200"/> <path d="M360 168 L310 200"/>
        <path d="M360 168 L360 200"/>
        <path d="M360 168 L410 200"/> <path d="M360 168 L480 200"/> <path d="M360 168 L600 200"/>
        <path d="M360 168 L740 200"/> <path d="M360 168 L980 200"/> <path d="M360 168 L1420 200"/>
      </g>
      <g stroke="url(#rs-ld-gridfade)" stroke-width="1" fill="none">
        <line x1="0" y1="170"   x2="720" y2="170"/>
        <line x1="0" y1="173.5" x2="720" y2="173.5"/>
        <line x1="0" y1="178.5" x2="720" y2="178.5"/>
        <line x1="0" y1="185.5" x2="720" y2="185.5"/>
        <line x1="0" y1="196"   x2="720" y2="196"/>
      </g>
    </g>

    <g opacity="0.95">
      <line x1="36" y1="168" x2="684" y2="168" stroke="url(#rs-ld-horizon)" stroke-width="1.25"/>
      <line class="flowline" x1="36" y1="168" x2="684" y2="168" stroke="url(#rs-ld-horizon)"
            stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
    </g>

    <!-- mark: a page with its top right corner folded forward, the fold catching the accent -->
    <g transform="translate(44,60)">
      <g filter="url(#rs-ld-glow)">
        <path d="M10 6 H54 L78 30 V82 H10 Z" fill="#0E1524"
              stroke="url(#rs-ld-mark)" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M54 6 L78 30 H54 Z" fill="url(#rs-ld-mark)"/>
        <g fill="#5B9DFF" opacity="0.55">
          <rect x="22" y="46" width="44" height="4" rx="2"/>
          <rect x="22" y="58" width="34" height="4" rx="2"/>
          <rect x="22" y="70" width="26" height="4" rx="2"/>
        </g>
      </g>
    </g>

    <text class="disp" x="168" y="110" font-size="62" font-weight="800" letter-spacing="-2"
          fill="url(#rs-ld-brand)">recap-studio</text>
    <text class="mono tag" x="170" y="142">one-file explainers · about 5 min read</text>
  </g>
</svg>
